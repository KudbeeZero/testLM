name: CI Rust Host
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install ts-runner deps
        run: |
          cd ts-runner
          npm ci
      - name: Strip example
        run: |
          node ts-runner/strip.js examples/hello.ts build/hello.js
      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - name: Build Rust host
        run: |
          cd host-rust
          cargo build --release
      - name: Run host smoke
        run: |
          ./host-rust/target/release/host-rust build/hello.js
