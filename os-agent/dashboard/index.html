<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Trust Agent / Workbench</title>
  <style>
    body{font-family:Segoe UI,Arial,Helvetica,sans-serif;margin:0;background:#f6f4ee;color:#17221f}
    .shell{max-width:1200px;margin:24px auto;padding:20px}
    header{display:flex;justify-content:space-between;align-items:end}
    h1{margin:0;font-size:28px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
    .card{background:#fff;padding:14px;border:1px solid #e0dbcf}
    .terminal{height:280px;overflow:auto;background:#0b0b0b;color:#cfcfcf;padding:12px;font-family:ui-monospace,monospace}
    .controls{display:flex;gap:8px;margin-top:8px}
    input[type=text]{flex:1;padding:8px;border:1px solid #ccc}
    button{padding:8px 12px}
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <div style="font-size:12px;color:#4e6b5d">Trust Agent / Operator Workbench</div>
        <h1>Control Room</h1>
      </div>
      <div id="status">connecting...</div>
    </header>

    <section class="grid">
      <div class="card">
        <h3>Tasks</h3>
        <form id="taskForm" style="display:flex;gap:8px;margin-bottom:8px">
          <input id="taskInput" type="text" placeholder="New task" />
          <button>ADD</button>
        </form>
        <div id="tasks">Loading…</div>
      </div>

      <div class="card">
        <h3>Interactive Terminal</h3>
        <div id="terminal" class="terminal">Connecting to local runtime…</div>
        <div class="controls">
          <input id="command" type="text" placeholder="npm test, git status, ..." />
          <button id="run">Run</button>
        </div>
      </div>
    </section>

    <section style="margin-top:14px">
      <div class="card">
        <h3>Handoff</h3>
        <div id="routes">Loading…</div>
      </div>
    </section>
  </main>

  <script>
    const $ = q => document.querySelector(q);
    async function refresh(){
      try{
        const s = await fetch('/api/state').then(r=>r.json());
        $('#status').textContent = 'live / ' + new Date().toLocaleTimeString();
        $('#tasks').innerHTML = s.tasks.length ? s.tasks.map(t => `<div><strong>${t.title}</strong> <small>${t.status}</small></div>`).join('') : '<div>No tasks</div>';
        $('#routes').innerHTML = Object.values(s.handoff).map(h=>`<div>${h.label} — ${h.status}</div>`).join('');
      }catch(e){$('#status').textContent='unavailable'}
    }

    $('#taskForm').onsubmit = async e => { e.preventDefault(); const title = $('#taskInput').value.trim(); if(!title) return; await fetch('/api/tasks',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})}); $('#taskInput').value=''; refresh(); };

    // WebSocket interactive terminal
    let ws;
    function ensureWs(){
      if(ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return ws;
      ws = new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host+'/ws/terminal');
      ws.onopen = ()=>{ $('#terminal').textContent += '\n[connected]\n'; };
      ws.onmessage = ev => { try { const m = JSON.parse(ev.data); if(m.stream==='out' || m.stream==='err'){ $('#terminal').textContent += m.text; } else if(m.stream==='exit'){ $('#terminal').textContent += `\n[exit ${m.code}]\n`; } } catch(e){ $('#terminal').textContent += ev.data; } $('#terminal').scrollTop = $('#terminal').scrollHeight; };
      ws.onclose = ()=>$('#terminal').textContent += '\n[disconnected]\n';
      ws.onerror = ()=>$('#terminal').textContent += '\n[error]\n';
      return ws;
    }

    $('#run').onclick = ()=>{ const cmd = $('#command').value.trim(); if(!cmd) return; $('#terminal').textContent += `\n> ${cmd}\n`; $('#command').value=''; const s = ensureWs(); if(s.readyState === WebSocket.OPEN) s.send(JSON.stringify({cmd})); else s.addEventListener('open',()=>s.send(JSON.stringify({cmd})),{once:true}); };

    refresh(); setInterval(refresh,5000);
  </script>
</body>
</html>
